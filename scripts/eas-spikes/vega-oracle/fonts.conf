<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Arial and sans-serif resolve to Liberation Sans (Arial's metrics),
     as rsvg-convert does on Linux.  Courier New, Courier and monospace
     resolve to TeX Gyre Cursor: bin/chart draws them in MS Courier New,
     and Cursor has its metrics and its slab-serif shapes, which the
     metric-compatible Liberation Mono and Cousine lack (the custom_text
     specs score 0.012 to 0.015 with Cursor, up to 0.066 with Liberation
     Mono).  Any other family falls back to sans-serif, not to whatever
     face sorts first.  FONTDIR is substituted by setup.sh and
     setup-rsvg.sh. -->
<fontconfig>
  <dir>FONTDIR</dir>
  <cachedir>FONTDIR/.cache</cachedir>
  <!-- fontconfig's stock 49-sansserif.conf. -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>sans-serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
    <edit name="family" mode="append_last"><string>sans-serif</string></edit>
  </match>
  <alias binding="same"><family>Arial</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Helvetica</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Courier New</family><accept><family>TeX Gyre Cursor</family></accept></alias>
  <alias binding="same"><family>Courier</family><accept><family>TeX Gyre Cursor</family></accept></alias>
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>TeX Gyre Cursor</family><family>Liberation Mono</family></prefer></alias>
</fontconfig>
